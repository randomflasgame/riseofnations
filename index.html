            color: inherit;

        /* =========================================================

        ========================================================= */

        .ron-intro {
            position: fixed;
            inset: 0;
            z-index: 99999;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 48%,
                    rgba(30, 105, 150, 0.18),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #020405 0%,
                    #071018 48%,
                    #010304 100%
                );

            opacity: 1;
            visibility: visible;

            transition:
                opacity 1s ease,
                visibility 1s ease;
        }

        .ron-intro.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }


        /* =========================================================
           INTRO BACKGROUND
        ========================================================= */

        .intro-grid {
            position: absolute;
            inset: -100px;

            background-image:
                linear-gradient(
                    rgba(75, 135, 175, 0.055) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(75, 135, 175, 0.055) 1px,
                    transparent 1px
                );

            background-size: 55px 55px;

            animation:
                introGridMove 10s linear infinite;

            opacity: 0.8;
        }

        @keyframes introGridMove {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(55px, 55px);
            }
        }


        .intro-vignette {
            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 20%,
                    rgba(0, 0, 0, 0.25) 55%,
                    rgba(0, 0, 0, 0.9) 100%
                );

            pointer-events: none;
        }


        .intro-scanline {
            position: absolute;
            left: 0;
            right: 0;
            top: -10%;

            height: 2px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(90, 175, 220, 0.7),
                    transparent
                );

            box-shadow:
                0 0 20px rgba(80, 170, 220, 0.5);

            animation:
                introScan 4s linear infinite;

            opacity: 0.5;
        }

        @keyframes introScan {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(120vh);
            }
        }


        /* =========================================================
           INTRO LIGHTS
        ========================================================= */

        .intro-light {
            position: absolute;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(35, 125, 175, 0.14),
                    transparent 68%
                );

            filter: blur(5px);

            animation:
                introLightPulse 3.5s ease-in-out infinite;
        }

        .intro-light.one {
            left: -160px;
            top: -150px;
        }

        .intro-light.two {
            right: -180px;
            bottom: -160px;

            animation-delay: 1.4s;
        }

        @keyframes introLightPulse {

            0%,
            100% {
                opacity: 0.25;
                transform: scale(0.9);
            }

            50% {
                opacity: 1;
                transform: scale(1.15);
            }
        }


        /* =========================================================
           INDUSTRIAL CORNERS
        ========================================================= */

        .intro-corner {
            position: absolute;

            width: 180px;
            height: 180px;

            border-color:
                rgba(90, 150, 185, 0.22);

            border-style: solid;

            opacity: 0.8;
        }

        .intro-corner.tl {
            left: 25px;
            top: 25px;

            border-width: 1px 0 0 1px;
        }

        .intro-corner.tr {
            right: 25px;
            top: 25px;

            border-width: 1px 1px 0 0;
        }

        .intro-corner.bl {
            left: 25px;
            bottom: 25px;

            border-width: 0 0 1px 1px;
        }

        .intro-corner.br {
            right: 25px;
            bottom: 25px;

            border-width: 0 1px 1px 0;
        }

           COMMAND CONSOLE
        ========================================================= */

        .intro-console {
            position: absolute;

            top: 7%;

        }

        .intro-console-line:nth-child(1) {

        }

        @keyframes consoleAppear {

        }

        @keyframes consoleLine {
            from {
                opacity: 0;
                transform: translateX(-8px);

            to {
                opacity: 1;

            }
        }

        .console-green {
            color: #73a88a;
        }

        .console-blue {
            color: #6798b8;
        }

        .console-gold {
            color: #bca05b;
        }

        }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
