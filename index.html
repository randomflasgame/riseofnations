<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RISE OF NATIONS</title>

    <meta
        name="description"
        content="RISE OF NATIONS — Minecraft 1.21.1 Modpack"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="command-screen">

        <!-- TOP COMMAND BAR -->
        <header class="top-bar">

            <div class="logo">
                RISE <span>OF</span> NATIONS
            </div>

            <div class="system-status">
                <span class="status-light"></span>
                SYSTEM ONLINE
            </div>

        </header>


        <!-- MAIN COMMAND CENTER -->
        <main class="main-content">

            <h1 class="title">
                RISE<br>
                OF NATIONS
            </h1>

            <div class="subtitle">
                GLOBAL COMMAND &amp; INTELLIGENCE SYSTEM
            </div>


            <!-- COMMAND PANELS -->
            <section class="command-panel">

                <div class="panel">
                    <div class="panel-label">
                        SERVER STATUS
                    </div>

                    <div class="panel-value">
                        ONLINE
                    </div>
                </div>


                <div class="panel">
                    <div class="panel-label">
                        CURRENT DEPLOYMENT
                    </div>

                    <div class="panel-value gold">
                        VERSION 1.0.0
                    </div>
                </div>


                <div class="panel">
                    <div class="panel-label">
                        MINECRAFT
                    </div>

                    <div class="panel-value">
                        1.21.1
                    </div>
                </div>


                <div class="panel">
                    <div class="panel-label">
                        INTELLIGENCE
                    </div>

                    <div class="panel-value">
                        ACTIVE
                    </div>
                </div>


                <div class="panel">
                    <div class="panel-label">
                        DATABASE
                    </div>

                    <div class="panel-value">
                        READY
                    </div>
                </div>


                <div class="panel">
                    <div class="panel-label">
                        COMMUNICATIONS
                    </div>

                    <div class="panel-value">
                        ONLINE
                    </div>
                </div>

            </section>

        </main>


        <!-- FOOTER -->
        <footer class="footer">

            <span>
                R.O.N. COMMAND SYSTEM
            </span>

            <span>
                ACCESS LEVEL: PUBLIC
            </span>

        </footer>

    </div>

</body>

</html>
