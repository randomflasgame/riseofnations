<title>RISE OF NATIONS // COMMAND NETWORK</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        min-height: 100%;
        background: #050a0f;
        color: #dce6ed;
        font-family:
            "Arial Narrow",
            "Segoe UI",
            Arial,
            sans-serif;
    }

    body {
        overflow-x: hidden;
    }

    button,
    input {
        font: inherit;
    }

    /* =====================================================
       INTRO
    ===================================================== */

    .ron-intro {
        position: fixed;
        inset: 0;
        z-index: 99999;

        display: flex;
        align-items: center;
        justify-content: center;

        overflow: hidden;

        background:
            radial-gradient(
                circle at center,
                rgba(25, 90, 130, 0.25),
                transparent 42%
            ),
            linear-gradient(
                135deg,
                #020507 0%,
                #071019 50%,
                #020507 100%
            );

        opacity: 1;
        visibility: visible;

        transition:
            opacity 0.9s ease,
            visibility 0.9s ease;
    }

    .ron-intro.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
    }

    /* GRID */

    .intro-grid {
        position: absolute;
        inset: -100px;

        background-image:
            linear-gradient(
                rgba(70, 140, 190, 0.055) 1px,
                transparent 1px
            ),
            linear-gradient(
                90deg,
                rgba(70, 140, 190, 0.055) 1px,
                transparent 1px
            );

        background-size: 50px 50px;

        transform: perspective(500px)
                   rotateX(60deg)
                   scale(1.5);

        transform-origin: center bottom;

        animation: gridMove 8s linear infinite;

        opacity: 0.8;
    }

    @keyframes gridMove {
        from {
            transform:
                perspective(500px)
                rotateX(60deg)
                scale(1.5)
                translateY(0);
        }

        to {
            transform:
                perspective(500px)
                rotateX(60deg)
                scale(1.5)
                translateY(50px);
        }
    }

    /* SCANLINES */

    .intro-scanlines {
        position: absolute;
        inset: 0;

        background:
            repeating-linear-gradient(
                to bottom,
                transparent 0,
                transparent 3px,
                rgba(255,255,255,0.018) 4px
            );

        pointer-events: none;
    }

    /* VIGNETTE */

    .intro-vignette {
        position: absolute;
        inset: 0;

        background:
            radial-gradient(
                circle,
                transparent 30%,
                rgba(0,0,0,0.75) 100%
            );

        pointer-events: none;
    }

    /* CONTENT */

    .intro-content {
        position: relative;
        z-index: 5;

        width: min(900px, 90vw);

        text-align: center;

        animation: introAppear 1.2s ease forwards;
    }

    @keyframes introAppear {
        from {
            opacity: 0;
            transform: scale(0.94);
        }

        to {
            opacity: 1;
            transform: scale(1);
        }
    }

    .intro-classification {
        margin-bottom: 18px;

        color: #5da9d6;

        font-size: 12px;
        font-weight: 700;

        letter-spacing: 5px;

        text-transform: uppercase;

        opacity: 0.8;
    }

    .intro-title {
        margin: 0;

        color: #eaf7ff;

        font-size: clamp(42px, 8vw, 92px);
        font-weight: 900;

        letter-spacing: 8px;
        line-height: 0.95;

        text-transform: uppercase;

        text-shadow:
            0 0 10px rgba(70, 170, 230, 0.5),
            0 0 30px rgba(30, 120, 180, 0.25);
    }

    .intro-subtitle {
        margin-top: 20px;

        color: #7da8bf;

        font-size: clamp(12px, 2vw, 17px);

        letter-spacing: 5px;

        text-transform: uppercase;
    }

    /* LINE */

    .intro-line {
        position: relative;

        width: min(600px, 80vw);
        height: 1px;

        margin: 35px auto;

        background:
            linear-gradient(
                90deg,
                transparent,
                #4d9cc7,
                transparent
            );

        box-shadow:
            0 0 10px rgba(60, 160, 220, 0.6);
    }

    /* STATUS */

    .intro-status {
        display: flex;

        justify-content: center;
        gap: 14px;

        margin-top: 25px;

        color: #82a7b8;

        font-size: 11px;
        letter-spacing: 3px;

        text-transform: uppercase;
    }
